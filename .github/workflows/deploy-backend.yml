name: Deploy Backend to Lightsail

on:
  push:
    branches: [main]
    paths:
      - 'backend_POSTGRESQL/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Laravel (self-hosted)
    runs-on: [self-hosted, prod]
    timeout-minutes: 15

    steps:
      - name: Pull + composer + migrate + cache
        run: sudo -u ubuntu /usr/local/bin/deltajalan-deploy

      - name: Restart queue worker
        run: sudo /usr/local/bin/restart-jalankita-workers

      - name: Reload PHP-FPM
        run: sudo systemctl reload php8.3-fpm

      - name: Verify endpoint live
        run: |
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://api.deltajalan.web.id/api/app/version?platform=android") && [ "$CODE" = "200" ] && echo "OK: /api/app/version live" && exit 0
            echo "coba-$i: HTTP $CODE, tunggu 10 dtk..."
            sleep 10
          done
          echo "GAGAL: endpoint belum live setelah 60 dtk"; exit 1
